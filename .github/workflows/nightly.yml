# The complete browser suite, once a day, regardless of what changed.
#
# CI runs smoke tests on every push and the full suite for high-risk changes.
# The nightly catches accumulated drift across light-tier pushes without making
# each ordinary interface change pay for the complete browser matrix.
#
# It deploys nothing. A red nightly is a bug report, not a rollback trigger.
name: nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  e2e-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e:export
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-dist-e2e-${{ github.run_id }}
          path: dist-e2e
          retention-days: 1
          if-no-files-found: error

  full-suite:
    needs: e2e-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browsers are ~180 MB and were re-downloaded on every shard of every
      # run: three runners fetching the same two binaries, with nothing between
      # them and an upstream hiccup. Measured on 2026-08-19, that step hung past
      # 25 minutes on all three shards while the whole job normally finishes in
      # four to six. Keyed on the resolved Playwright version, so a version bump
      # misses the cache exactly once and nothing else does.
      - id: playwright-version
        run: echo "value=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.value }}
      # Only on a miss, and only then. The `--with-deps` half is an
      # `apt-get install`, and that is the step that hangs: measured on
      # 2026-08-19, two shards sat on it for 11+ minutes while a third finished
      # the identical step in three and went on to pass its whole suite. On a
      # hit the browsers come from the cache and the system libraries are
      # already in the runner image, so there is nothing to install and nothing
      # to wait on. A genuinely missing library fails loudly at browser launch
      # rather than silently, which is why this is safe to skip.
      - run: npx playwright install chromium firefox --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-dist-e2e-${{ github.run_id }}
          path: dist-e2e
      - run: npx playwright test --shard=${{ matrix.shard }}/3
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-failure-${{ github.run_id }}-shard${{ matrix.shard }}
          path: |
            test-results
            playwright-report
          retention-days: 7

  # Is the site serving what `main` says it should be?
  #
  # Nothing has ever asked. A green `main` and a stale production are the same
  # picture from inside this repository, and the two have come apart for a real
  # reason rather than a hypothetical one: a failed gate on an app-bearing push
  # followed by a test-only fix classifies light, skips the deploy, and leaves
  # the site on the previous version with every check green above it. That was
  # recovered by hand, after someone happened to look.
  #
  # This is the cheapest possible detector: fetch the shell, follow it to the
  # entry bundle, and look for the version `app.json` claims. It runs in the
  # nightly because a red nightly is a bug report and this is exactly that —
  # it publishes nothing and rolls nothing back.
  published-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # The same script `deploy-web` runs the moment it publishes, asked here of
      # whatever is live without an expected bundle name. The escaped-manifest
      # trap that once made this check fail identically on a healthy site is
      # recorded beside `appVersionOf`, where it is now tested.
      - name: Compare the live bundle against app.json
        run: node scripts/check-published.mjs web https://topraksv.github.io/helix

  # Can anyone open what `deploy-mobile` publishes?
  #
  # Expo Go runs one SDK — the one the stores carry — and an update for any
  # other SDK still publishes green and opens on no up-to-date phone. That
  # happened once: the repository sat three SDKs behind the store's client with
  # every run green, and the runbook's manual check was the only thing that
  # could have said so. Expo's newest listed SDK is not the answer on its own,
  # because a preview is listed before any store carries it; the script reads
  # the newest RELEASED one. Like the job above, it reports and changes nothing.
  expo-go-reach:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Compare this project's SDK with the stores' Expo Go
        run: node scripts/check-published.mjs expo-go
