# The complete browser suite, once a day, regardless of what changed.
#
# CI runs smoke tests on every push and the full suite for high-risk changes.
# The nightly catches accumulated drift across light-tier pushes without making
# each ordinary interface change pay for the complete browser matrix.
#
# It deploys nothing. A red nightly is a bug report, not a rollback trigger.
name: nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  e2e-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e:export
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-dist-e2e-${{ github.run_id }}
          path: dist-e2e
          retention-days: 1
          if-no-files-found: error

  full-suite:
    needs: e2e-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium firefox --with-deps
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-dist-e2e-${{ github.run_id }}
          path: dist-e2e
      - run: npx playwright test --shard=${{ matrix.shard }}/3
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-failure-${{ github.run_id }}-shard${{ matrix.shard }}
          path: |
            test-results
            playwright-report
          retention-days: 7
