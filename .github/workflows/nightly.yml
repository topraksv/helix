# The complete browser suite, once a day, regardless of what changed.
#
# CI only runs the full E2E paket when the diff is high risk, which is right for
# the common case and wrong for slow drift: a route that quietly stops being
# accessible, a layout that only breaks at one width, a resilience path nobody
# touched for a month. This catches those without making every ordinary commit
# pay for them.
#
# It deploys nothing. A red nightly is a bug report, not a rollback trigger.
name: nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  e2e-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e:export
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-dist-e2e-${{ github.run_id }}
          path: dist-e2e
          retention-days: 1
          if-no-files-found: error

  full-suite:
    needs: e2e-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: nightly-dist-e2e-${{ github.run_id }}
          path: dist-e2e
      - run: npx playwright test --shard=${{ matrix.shard }}/2
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-failure-${{ github.run_id }}-shard${{ matrix.shard }}
          path: |
            test-results
            playwright-report
          retention-days: 7
