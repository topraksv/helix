# Risk-tiered verification and automatic delivery from main.
#
# Every push proves type, lint, unit and browser-smoke behavior. Changes to
# correctness-sensitive or unrecognised paths add coverage, mutation and the
# sharded browser suite. Both deploy targets consume that same `gate` result;
# the classifier decides whether either artifact can have changed.
#
# The EXPO_PUBLIC_* values are client-side keys: they ship inside the JS bundle
# by design (same values as .env), so they are safe here. The service role key
# is NOT used in this workflow — it lives only in the keepalive secret.
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_target:
        description: "Optional redeploy target; none runs the full checks only."
        required: true
        type: choice
        options: [none, web, mobile, both]
        default: none

permissions:
  contents: read

# A newer push makes an older run's answer worthless: it can only certify a
# commit that is no longer the head of main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_PUBLIC_SUPABASE_URL: https://nwenaeyimbqxyhhsfrsi.supabase.co
  EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_NvhpZdHfjtL1zRBLQp60gQ_FS90zaj3

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.route.outputs.run_ci }}
      light_gate: ${{ steps.route.outputs.light_gate }}
      full_gate: ${{ steps.route.outputs.full_gate }}
      run_web_build: ${{ steps.route.outputs.run_web_build }}
      deploy_web: ${{ steps.route.outputs.deploy_web }}
      deploy_mobile: ${{ steps.route.outputs.deploy_mobile }}
      reason: ${{ steps.route.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A fast-forward may contain months of commits. The push event's
          # `before` SHA must exist locally or the safe classifier answer is an
          # unnecessary fail-open dual deploy.
          fetch-depth: 0
      - id: raw
        name: Classify changed paths
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/classify-changes.mjs "$BASE_SHA" "$HEAD_SHA"
      - id: route
        name: Apply an explicit manual target override
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TARGET: ${{ inputs.release_target || 'none' }}
          RUN_CI: ${{ steps.raw.outputs.run_ci }}
          LIGHT_GATE: ${{ steps.raw.outputs.light_gate }}
          FULL_GATE: ${{ steps.raw.outputs.full_gate }}
          RUN_WEB_BUILD: ${{ steps.raw.outputs.run_web_build }}
          DEPLOY_WEB: ${{ steps.raw.outputs.deploy_web }}
          DEPLOY_MOBILE: ${{ steps.raw.outputs.deploy_mobile }}
          REASON: ${{ steps.raw.outputs.reason }}
        run: |
          set -euo pipefail
          run_web_build="$RUN_WEB_BUILD"
          deploy_web="$DEPLOY_WEB"
          deploy_mobile="$DEPLOY_MOBILE"

          # A dispatch has no honest diff and therefore keeps the classifier's
          # fail-open full gate. The explicit target only narrows publication.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            run_web_build=false
            deploy_web=false
            deploy_mobile=false
            case "$RELEASE_TARGET" in
              none) ;;
              web) run_web_build=true; deploy_web=true ;;
              mobile) deploy_mobile=true ;;
              both) run_web_build=true; deploy_web=true; deploy_mobile=true ;;
              *) echo "::error::unknown release target '$RELEASE_TARGET'"; exit 1 ;;
            esac
          fi

          {
            echo "run_ci=$RUN_CI"
            echo "light_gate=$LIGHT_GATE"
            echo "full_gate=$FULL_GATE"
            echo "run_web_build=$run_web_build"
            echo "deploy_web=$deploy_web"
            echo "deploy_mobile=$deploy_mobile"
            echo "reason=$REASON"
          } >> "$GITHUB_OUTPUT"
          echo "classification: $REASON"
          echo "light=$LIGHT_GATE full=$FULL_GATE web-build=$run_web_build web=$deploy_web mobile=$deploy_mobile"

  light-gate:
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Expo SDK 54 tooling is incompatible with Node 24/26 native TypeScript
      # stripping (it chokes on expo-modules-core's src/index.ts). Node 22 is
      # the newest LTS the SDK 54 build supports.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run control:check
      - run: npm run typecheck
      - run: npx expo lint
      # On a full-gate push `test:coverage` runs this same suite under the
      # per-file thresholds, so running it here too would execute every unit
      # test twice for one commit.
      - if: needs.classify.outputs.full_gate != 'true'
        run: npx vitest run

  full-gate:
    needs: classify
    if: needs.classify.outputs.full_gate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The mutation selector compares the event base with the cutover
          # commit; a depth-one checkout would silently fall back to sentinels.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Coverage repeats the unit suite to enforce the per-file financial and
      # persistence thresholds; the light run remains mandatory on every push.
      - run: npm run test:coverage
      # Mutate high-risk production files changed after the Phase 6 cutover.
      # Config-only changes and the cutover push use the proven sentinel scope;
      # the canonical broad command remains the honest red gap inventory.
      - run: npm run test:mutation:ci
        env:
          MUTATION_BASE_SHA: ${{ github.event.before }}
          MUTATION_HEAD_SHA: ${{ github.sha }}
          MUTATION_EVENT_NAME: ${{ github.event_name }}

  web-build:
    needs: classify
    if: needs.classify.outputs.run_web_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `--clear` is mandatory on every production bundle: Metro's transform
      # cache is shared by `expo export` and `eas update` and its key does NOT
      # include EXPO_PUBLIC_* values, so a cache left behind by the local-only
      # E2E export produces a bundle with no Supabase configuration at all.
      - run: npx expo export -p web --clear
      - run: npm run bundle:check
      # GitHub Pages serves 404.html for unknown paths (e.g. deep links to
      # dynamic routes like /cash-flow/2026-05). Use the root shell: copying
      # +not-found hydrates the wrong server route before the client resolves
      # the real URL and emits React hydration error #418.
      - run: cp dist/index.html dist/404.html
      # Uploaded here and only here. `deploy-web` consumes this exact artifact,
      # so the bytes that were budget-checked are the bytes that get served.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  # The always-on browser signal for a light-tier push. A full-gate push runs
  # `e2e-full`, whose 114 tests already contain these 24 `@smoke` ones, so
  # running both would repeat them and pay for a third Metro export.
  e2e-smoke:
    needs: classify
    if: needs.classify.outputs.full_gate != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browsers are ~180 MB and were re-downloaded on every shard of every
      # run: three runners fetching the same two binaries, with nothing between
      # them and an upstream hiccup. Measured on 2026-08-19, that step hung past
      # 25 minutes on all three shards while the whole job normally finishes in
      # four to six. Keyed on the resolved Playwright version, so a version bump
      # misses the cache exactly once and nothing else does.
      - id: playwright-version
        run: echo "value=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.value }}
      # Only on a miss, and only then. The `--with-deps` half is an
      # `apt-get install`, and that is the step that hangs: measured on
      # 2026-08-19, two shards sat on it for 11+ minutes while a third finished
      # the identical step in three and went on to pass its whole suite. On a
      # hit the browsers come from the cache and the system libraries are
      # already in the runner image, so there is nothing to install and nothing
      # to wait on. A genuinely missing library fails loudly at browser launch
      # rather than silently, which is why this is safe to skip.
      - run: npx playwright install chromium firefox --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      # The E2E export is local-only by construction (blank Supabase env), which
      # is why it never becomes the Pages artifact and why the suite can never
      # write to real data.
      - run: npm run test:e2e:smoke
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-smoke-failure-${{ github.run_id }}
          path: |
            test-results
            playwright-report
          retention-days: 7

  # One export for the whole sharded run. Each shard used to build its own
  # `dist-e2e`, which cost a second full Metro bundle and — worse — let the two
  # shards test two separately-produced artifacts. They now share these bytes.
  # The sharded full suite is expensive, so the classifier reserves it for
  # high-risk pushes and explicit dispatches. Nightly remains the drift net.
  e2e-build:
    needs: classify
    if: needs.classify.outputs.full_gate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e:export
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-e2e-${{ github.run_id }}
          path: dist-e2e
          retention-days: 1
          # The export contains symlink-free static output; failing loudly on an
          # empty upload beats a shard starting against a missing app.
          if-no-files-found: error

  e2e-full:
    needs: [classify, e2e-build]
    if: >-
      ${{ !cancelled()
      && needs.classify.outputs.full_gate == 'true'
      && needs.e2e-build.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browsers are ~180 MB and were re-downloaded on every shard of every
      # run: three runners fetching the same two binaries, with nothing between
      # them and an upstream hiccup. Measured on 2026-08-19, that step hung past
      # 25 minutes on all three shards while the whole job normally finishes in
      # four to six. Keyed on the resolved Playwright version, so a version bump
      # misses the cache exactly once and nothing else does.
      - id: playwright-version
        run: echo "value=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.value }}
      # Only on a miss, and only then. The `--with-deps` half is an
      # `apt-get install`, and that is the step that hangs: measured on
      # 2026-08-19, two shards sat on it for 11+ minutes while a third finished
      # the identical step in three and went on to pass its whole suite. On a
      # hit the browsers come from the cache and the system libraries are
      # already in the runner image, so there is nothing to install and nothing
      # to wait on. A genuinely missing library fails loudly at browser launch
      # rather than silently, which is why this is safe to skip.
      - run: npx playwright install chromium firefox --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-e2e-${{ github.run_id }}
          path: dist-e2e
      # Three runners, one worker each. Parallelism comes from sharding, not
      # from raising `workers` — this suite drives one browser against one
      # static server and got flaky the moment two workers shared it. The
      # shards are balanced by `fullyParallel` in the Playwright config, which
      # is what makes a third runner worth having: split by file instead, one
      # shard took 65 of the 75 tests. Playwright is invoked directly so the
      # shared artifact is not overwritten by a rebuild.
      - run: npx playwright test --shard=${{ matrix.shard }}/3
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-full-failure-${{ github.run_id }}-shard${{ matrix.shard }}
          path: |
            test-results
            playwright-report
          retention-days: 7

  # The one required check. Tier-inapplicable jobs are correctly skipped, so
  # only a failure or cancellation blocks either deploy target.
  gate:
    if: always()
    needs: [classify, light-gate, full-gate, web-build, e2e-smoke, e2e-build, e2e-full]
    runs-on: ubuntu-latest
    steps:
      - name: Fail on any real job failure
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "blocking deploy: a required job reported '$result'"; exit 1 ;;
            esac
          done

  # `gate` is declared `if: always()` so a correctly skipped job cannot block
  # it. GitHub then propagates that upstream "skipped" state down the needs
  # chain, so a plain `needs: gate` leaves this job skipped even when `gate`
  # itself succeeded. `!cancelled()` replaces that implicit rule, and the
  # `result` check puts back the only part of it that was wanted: a failed or
  # skipped gate must still stop the deploy.
  deploy-web:
    needs: [classify, gate, web-build]
    if: >-
      ${{ !cancelled()
      && needs.gate.result == 'success'
      && needs.web-build.result == 'success'
      && needs.classify.outputs.deploy_web == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: helix
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Publishes the artifact `web-build` produced. No second export: a
      # rebuild here could serve bytes nothing in this run ever checked.
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        with:
          # The action's 10-minute default is below what the Pages backend
          # actually takes. On `8ac62ab` it sat in `deployment_in_progress`
          # past the limit, the action aborted the run red — and Pages then
          # published the very same artifact anyway. So the default buys no
          # safety: it only converts a slow deploy into a false failure that
          # also skips the live smoke below. Prior runs took 3m51s, 4m05s and
          # 5m57s for identical bytes, so the ceiling has to clear that spread
          # by a wide margin, not track it.
          timeout: "1800000"
      - name: Smoke the live deployment
        env:
          BASE: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${BASE%/}"
          echo "checking $base"
          root=$(curl -sS -L -o /tmp/root.html -w "%{http_code}" "$base/")
          echo "root: $root"; [ "$root" = "200" ]
          sub=$(curl -sS -L -o /dev/null -w "%{http_code}" "$base/upcoming")
          echo "sub-route: $sub"; [ "$sub" = "200" ]
          # The shell is useless without the bundle it references, and a 404
          # here is exactly what a half-published artifact looks like.
          bundle=$(grep -o '/_expo/static/js/web/[^"]*\.js' /tmp/root.html | head -1)
          [ -n "$bundle" ] || { echo "no entry bundle referenced in the served shell"; exit 1; }
          js=$(curl -sS -L -o /dev/null -w "%{http_code}" "$base$bundle")
          echo "bundle $bundle: $js"; [ "$js" = "200" ]

  deploy-mobile:
    needs: [classify, gate]
    if: >-
      ${{ !cancelled()
      && needs.gate.result == 'success'
      && needs.classify.outputs.deploy_mobile == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: helix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Publish directly from this checked-out commit, after the gate. Expo Go
      # uses the SDK runtime, so there is no binary lookup, build or Apple
      # credential path. The CLI and its transitive tree are installed from the
      # integrity-checked lockfile before the credential exists in a step. This
      # keeps dependency install scripts outside the EXPO_TOKEN boundary.
      - name: Publish Expo Go preview update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::EXPO_TOKEN is not configured; the preview OTA was not published."
            exit 1
          fi
          npx --yes eas-cli@21.4.0 update --branch preview --platform all --message "main $GITHUB_SHA" --clear-cache --non-interactive
