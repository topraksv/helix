# Risk-tiered verification and automatic delivery from main.
#
# Every push proves type, lint, unit and browser-smoke behavior. Changes to
# correctness-sensitive or unrecognised paths add coverage, mutation and the
# sharded browser suite. Both deploy targets consume that same `gate` result;
# the classifier decides whether either artifact can have changed.
#
# "Changed" is measured from the last push run that finished green, never from
# the previous push alone. A run that fails or is cancelled publishes nothing,
# and measuring from `github.event.before` handed its unpublished changes to a
# follow-up that could not see them. Replayed over the 100 runs before this was
# written: eight windows per surface in which a green `main` was ahead of
# production, the longest 2.6 days, five of them closed by a manual dispatch.
#
# The EXPO_PUBLIC_* values are client-side keys: they ship inside the JS bundle
# by design (same values as .env), so they are safe here. The service role key
# is NOT used in this workflow — it lives only in the keepalive secret.
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_target:
        description: "Optional redeploy target; none runs the full checks only."
        required: true
        type: choice
        options: [none, web, mobile, both]
        default: none

permissions:
  contents: read

# A newer push makes an older run's answer worthless: it can only certify a
# commit that is no longer the head of main. Cancelling it loses nothing,
# because the newer run measures from the last green run and so carries
# everything the cancelled one would have published.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_PUBLIC_SUPABASE_URL: https://nwenaeyimbqxyhhsfrsi.supabase.co
  EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_NvhpZdHfjtL1zRBLQp60gQ_FS90zaj3

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # The `base` step reads this workflow's own run history.
      actions: read
    outputs:
      base: ${{ steps.base.outputs.sha }}
      run_ci: ${{ steps.route.outputs.run_ci }}
      light_gate: ${{ steps.route.outputs.light_gate }}
      full_gate: ${{ steps.route.outputs.full_gate }}
      run_web_build: ${{ steps.route.outputs.run_web_build }}
      deploy_web: ${{ steps.route.outputs.deploy_web }}
      deploy_mobile: ${{ steps.route.outputs.deploy_mobile }}
      reason: ${{ steps.route.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A fast-forward may contain months of commits, and the base below
          # can be older still. It must exist locally or the safe classifier
          # answer is an unnecessary fail-open dual deploy.
          fetch-depth: 0
      # Only a green run published what its diff selected, so the newest green
      # push run that this commit descends from is where production stands. The
      # push's own `before` is the fallback when there is none to find — the
      # first run, an unanswered API call — and a dispatch keeps no base at
      # all, because its fail-open full gate is the point of dispatching.
      - id: base
        name: Measure from the last run that published
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base=""
          if [ "$EVENT_NAME" = "push" ]; then
            base="$BEFORE_SHA"
            green=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // ""') || green=""
            if [ -n "$green" ] && git merge-base --is-ancestor "$green" "$HEAD_SHA"; then
              base="$green"
            else
              echo "::warning::no green ci push run is an ancestor of $HEAD_SHA; measuring from the push's own base, which cannot see an earlier run that published nothing"
            fi
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "base: ${base:-none}"
      - id: raw
        name: Classify changed paths
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/classify-changes.mjs "$BASE_SHA" "$HEAD_SHA"
      - id: route
        name: Apply an explicit manual target override
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TARGET: ${{ inputs.release_target || 'none' }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          RUN_CI: ${{ steps.raw.outputs.run_ci }}
          LIGHT_GATE: ${{ steps.raw.outputs.light_gate }}
          FULL_GATE: ${{ steps.raw.outputs.full_gate }}
          RUN_WEB_BUILD: ${{ steps.raw.outputs.run_web_build }}
          DEPLOY_WEB: ${{ steps.raw.outputs.deploy_web }}
          DEPLOY_MOBILE: ${{ steps.raw.outputs.deploy_mobile }}
          REASON: ${{ steps.raw.outputs.reason }}
        run: |
          set -euo pipefail
          run_web_build="$RUN_WEB_BUILD"
          deploy_web="$DEPLOY_WEB"
          deploy_mobile="$DEPLOY_MOBILE"

          # A dispatch has no honest diff and therefore keeps the classifier's
          # fail-open full gate. The explicit target only narrows publication.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            run_web_build=false
            deploy_web=false
            deploy_mobile=false
            case "$RELEASE_TARGET" in
              none) ;;
              web) run_web_build=true; deploy_web=true ;;
              mobile) deploy_mobile=true ;;
              both) run_web_build=true; deploy_web=true; deploy_mobile=true ;;
              *) echo "::error::unknown release target '$RELEASE_TARGET'"; exit 1 ;;
            esac
          fi

          {
            echo "run_ci=$RUN_CI"
            echo "light_gate=$LIGHT_GATE"
            echo "full_gate=$FULL_GATE"
            echo "run_web_build=$run_web_build"
            echo "deploy_web=$deploy_web"
            echo "deploy_mobile=$deploy_mobile"
            echo "reason=$REASON"
          } >> "$GITHUB_OUTPUT"
          echo "classification: $REASON"
          echo "light=$LIGHT_GATE full=$FULL_GATE web-build=$run_web_build web=$deploy_web mobile=$deploy_mobile"

          # The same answer, on the run's summary page rather than inside a
          # step nobody opens. Every job below is conditional, and a skipped
          # job in the GitHub UI looks identical whether it was correctly
          # inapplicable or silently misrouted — `e2e-smoke` in particular has
          # been skipped on every push so far, which reads as a step that never
          # runs rather than as the light tier's browser gate waiting for a
          # light-tier push. This says which tier was chosen, why, and which of
          # the two browser jobs that implies, so the question is answered
          # before it is asked.
          if [ "$FULL_GATE" = "true" ]; then
            browser="e2e-full (3 shards, the whole suite) — e2e-smoke is skipped because its tests are a subset of it"
          elif [ "$RUN_CI" = "true" ]; then
            browser="e2e-smoke (@smoke only) — e2e-full is skipped because this tier does not pay for the sharded suite"
          else
            browser="none — no application impact"
          fi
          {
            echo "### Gate tier: ${FULL_GATE/true/full}"
            echo ""
            echo "- **Reason:** $REASON"
            echo "- **Measured from:** ${BASE_SHA:-no base (a dispatch runs everything)}"
            echo "- **Browser check:** $browser"
            echo "- **Publishes:** web=$deploy_web · mobile=$deploy_mobile"
          } >> "$GITHUB_STEP_SUMMARY"

  light-gate:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # This job runs the unit suite whenever the full gate does NOT, and
          # that suite asserts the mutation selector against real history from
          # a fixed commit. A depth-one checkout does not contain it, so
          # `git diff <base>..HEAD` fails and the selector throws rather than
          # answering — the same reason `classify` and `full-gate` take the
          # full history. It stayed hidden because every push until now was
          # high-risk, which skips the step below and runs the suite in
          # `full-gate` instead; the first docs-only push to main found it.
          fetch-depth: 0
      # `.nvmrc` is the version, here and locally. Node 24/26 native TypeScript
      # stripping breaks this SDK's toolchain (it chokes on expo-modules-core's
      # src/index.ts), so the pin is a floor AND a ceiling and
      # `docs/ARCHITECTURE.md` records both. It was written out as `22` fifteen
      # times across four workflows until 2026-09-21; a band with two reasons
      # behind it cannot survive being edited in fifteen places.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The ratchet runs ESLint itself and gates on `lint-baseline.json`, so
      # this is the lint step rather than a second one after it. Errors still
      # fail outright; a rule that fires more often than the baseline records
      # fails too, which a warning-tolerant `expo lint` never could.
      - run: npm run lint:ratchet
      # On a full-gate push `test:coverage` runs this same suite under the
      # per-file thresholds, so running it here too would execute every unit
      # test twice for one commit.
      - if: needs.classify.outputs.full_gate != 'true'
        run: npx vitest run

  full-gate:
    # After the light gate, never beside it. A push that fails typecheck or
    # lint cannot deploy whatever mutation finds, and the 1.8.0 scope ran past
    # 90 minutes on one runner; waiting costs the minute the light gate takes.
    needs: [classify, light-gate]
    if: needs.classify.outputs.full_gate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Divided across runners rather than given a longer limit. One runner
    # stopped being enough on 2026-09-15: the 1.8.0 release changed 28 files in
    # scope, 9,832 mutants, which took 67 minutes on four local workers and ran
    # past this job's 90 minutes on a GitHub runner — the deploy waited behind a
    # gate that had found nothing. Every job keeps its limit
    # (`tests/repo/release-config.test.ts`); `stryker.ci.config.mjs` deals each shard
    # its part of the scope.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # The classifier's base, so mutation covers every change that has not yet
      # passed a gate — a failed run's included — and not only this push's.
      MUTATION_BASE_SHA: ${{ needs.classify.outputs.base }}
      MUTATION_HEAD_SHA: ${{ github.sha }}
      MUTATION_EVENT_NAME: ${{ github.event_name }}
      MUTATION_SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The mutation selector compares the event base with the cutover
          # commit; a depth-one checkout would silently fall back to sentinels.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Coverage repeats the unit suite to enforce the per-file financial and
      # persistence thresholds; the light run remains mandatory on every push.
      # Once per run, so on one shard.
      - if: matrix.shard == 1
        run: npm run test:coverage
      # A shard dealt no file skips the pass instead of handing Stryker an
      # empty list, which a change touching one file does to two of the three.
      - id: scope
        run: |
          set -euo pipefail
          files=$(node --input-type=module -e 'const { default: config } = await import("./stryker.ci.config.mjs"); console.log(config.mutate.length)')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "shard $MUTATION_SHARD mutates $files file(s)"
      # Mutate high-risk production files changed after the Phase 6 cutover.
      # Config-only changes and the cutover push use the proven sentinel scope;
      # the canonical broad command remains the honest red gap inventory.
      - if: steps.scope.outputs.files != '0'
        run: npm run test:mutation:ci
      # The ratchet names the files that regressed; the surviving mutants that
      # explain why are in this report, and re-running a release scope to find
      # them costs the same hour again.
      - if: failure() && steps.scope.outputs.files != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report-${{ github.run_id }}-shard${{ matrix.shard }}
          path: reports/mutation/ci-mutation.json
          retention-days: 7
          if-no-files-found: ignore

  web-build:
    needs: classify
    if: needs.classify.outputs.run_web_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      entry: ${{ steps.entry.outputs.path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # `--clear` is mandatory on every production bundle: Metro's transform
      # cache is shared by `expo export` and `eas update` and its key does NOT
      # include EXPO_PUBLIC_* values, so a cache left behind by the local-only
      # E2E export produces a bundle with no Supabase configuration at all.
      - run: npx expo export -p web --clear
      - run: npm run bundle:check
      # GitHub Pages serves 404.html for unknown paths (e.g. deep links to
      # dynamic routes like /cash-flow/2026-05). Use the root shell: copying
      # +not-found hydrates the wrong server route before the client resolves
      # the real URL and emits React hydration error #418.
      - run: cp dist/index.html dist/404.html
      # The one name in the export that changes whenever its code does: the
      # entry bundle is named by its content hash. `deploy-web` asks the live
      # site for exactly this name, read by the same code.
      - id: entry
        run: node scripts/check-published.mjs entry dist >> "$GITHUB_OUTPUT"
      # Uploaded here and only here. `deploy-web` consumes this exact artifact,
      # so the bytes that were budget-checked are the bytes that get served.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  # The browser signal for a LIGHT-tier push, and the reason it is usually
  # skipped: a full-gate push runs `e2e-full`, whose suite already contains
  # every `@smoke` test, so running both would repeat them and pay for a third
  # Metro export.
  #
  # WHEN IT RUNS. Whenever `classify` does not raise the full gate — a change
  # confined to `src/ui`, `src/app/*.tsx`, `src/i18n`, `tests`, `e2e`,
  # `public`, `assets`, a local script or a workflow other than this one.
  # `scripts/classify-changes.mjs` holds the lists and
  # `tests/repo/change-classification.test.ts` holds them against the tree. Most
  # pushes so far have touched `src/domain` or `src/data`, which is money and
  # persistence and always takes the full gate, so this job has been correctly
  # skipped rather than inert — the classify job's summary says which tier a
  # run chose and why.
  e2e-smoke:
    needs: classify
    if: needs.classify.outputs.full_gate != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The browsers are ~180 MB and were re-downloaded on every shard of every
      # run: three runners fetching the same two binaries, with nothing between
      # them and an upstream hiccup. Measured on 2026-08-19, that step hung past
      # 25 minutes on all three shards while the whole job normally finishes in
      # four to six. Keyed on the resolved Playwright version, so a version bump
      # misses the cache exactly once and nothing else does.
      - id: playwright-version
        run: echo "value=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.value }}
      # Only on a miss, and only then. The `--with-deps` half is an
      # `apt-get install`, and that is the step that hangs: measured on
      # 2026-08-19, two shards sat on it for 11+ minutes while a third finished
      # the identical step in three and went on to pass its whole suite. On a
      # hit the browsers come from the cache and the system libraries are
      # already in the runner image, so there is nothing to install and nothing
      # to wait on. A genuinely missing library fails loudly at browser launch
      # rather than silently, which is why this is safe to skip.
      - run: npx playwright install chromium firefox --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      # The E2E export is local-only by construction (blank Supabase env), which
      # is why it never becomes the Pages artifact and why the suite can never
      # write to real data.
      - run: npm run test:e2e:smoke
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-smoke-failure-${{ github.run_id }}
          path: |
            test-results
            playwright-report
          retention-days: 7

  # One export for the whole sharded run. Each shard used to build its own
  # `dist-e2e`, which cost a second full Metro bundle and — worse — let the two
  # shards test two separately-produced artifacts. They now share these bytes.
  # The sharded full suite is expensive, so the classifier reserves it for
  # high-risk pushes and explicit dispatches. Nightly remains the drift net.
  e2e-build:
    needs: classify
    if: needs.classify.outputs.full_gate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:e2e:export
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-e2e-${{ github.run_id }}
          path: dist-e2e
          retention-days: 1
          # The export contains symlink-free static output; failing loudly on an
          # empty upload beats a shard starting against a missing app.
          if-no-files-found: error

  e2e-full:
    needs: [classify, e2e-build]
    if: >-
      ${{ !cancelled()
      && needs.classify.outputs.full_gate == 'true'
      && needs.e2e-build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Browsers are cached and installed exactly as in `e2e-smoke` above, for
      # the two measured hangs recorded there.
      - id: playwright-version
        run: echo "value=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.value }}
      - run: npx playwright install chromium firefox --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-e2e-${{ github.run_id }}
          path: dist-e2e
      # Three runners, one worker each. Parallelism comes from sharding, not
      # from raising `workers` — this suite drives one browser against one
      # static server and got flaky the moment two workers shared it. The
      # shards are balanced by `fullyParallel` in the Playwright config, which
      # is what makes a third runner worth having: split by file instead, one
      # shard took 65 of the 75 tests. Playwright is invoked directly so the
      # shared artifact is not overwritten by a rebuild.
      - run: npx playwright test --shard=${{ matrix.shard }}/3
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-full-failure-${{ github.run_id }}-shard${{ matrix.shard }}
          path: |
            test-results
            playwright-report
          retention-days: 7

  # What both deploys wait on. It is not a branch-protection required check:
  # pushes land on `main` directly, and a required check would refuse every
  # one of them, so this job is the only merge gate there is. Tier-inapplicable
  # jobs are correctly skipped, so only a failure or cancellation blocks either
  # deploy target.
  gate:
    if: always()
    needs: [classify, light-gate, full-gate, web-build, e2e-smoke, e2e-build, e2e-full]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail on any real job failure
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "blocking deploy: a required job reported '$result'"; exit 1 ;;
            esac
          done

  # `gate` is declared `if: always()` so a correctly skipped job cannot block
  # it. GitHub then propagates that upstream "skipped" state down the needs
  # chain, so a plain `needs: gate` leaves this job skipped even when `gate`
  # itself succeeded. `!cancelled()` replaces that implicit rule, and the
  # `result` check puts back the only part of it that was wanted: a failed or
  # skipped gate must still stop the deploy.
  deploy-web:
    needs: [classify, gate, web-build]
    if: >-
      ${{ !cancelled()
      && needs.gate.result == 'success'
      && needs.web-build.result == 'success'
      && needs.classify.outputs.deploy_web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      # The checkout, and the question of where `main` is now.
      contents: read
      pages: write
      id-token: write
    environment:
      name: helix
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # A re-run replays its own commit, and publishing that after `main` has
      # moved would put older bytes over newer ones. So a superseded run stops
      # here, and it FAILS rather than skipping: the next push measures from
      # the last green run, and this commit must still count as unpublished.
      - name: Refuse to publish a commit main has moved past
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::main is at $head and this run is $GITHUB_SHA; nothing was published, and the run for $head publishes"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Publishes the artifact `web-build` produced. No second export: a
      # rebuild here could serve bytes nothing in this run ever checked.
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          # Ten minutes is the most this action accepts: a higher value is
          # clamped to 600000 with a warning on the run. Measured on this
          # repository's own deploys — the thirty minutes this input asked for
          # on 949f19d, and twenty on 5d2556c, were both clamped, so no deploy
          # here has ever waited longer than ten. On `8ac62ab` the backend sat
          # in `deployment_in_progress` past the limit, the action went red and
          # Pages published the artifact anyway; prior runs took 3m51s to
          # 5m57s. A deploy that crosses the cap is therefore a false failure,
          # not a lost one: the run fails, and the next push measures from the
          # last green run and publishes again.
          timeout: "600000"
      # Not a 200: Pages answers 200 with the PREVIOUS deploy while the new one
      # propagates. The shell must reference the entry bundle `web-build` named,
      # the site must serve it, and it must declare the version `app.json`
      # names. The shell is cached for ten minutes (`cache-control:
      # max-age=600`, measured), so a stale one is asked again for that long
      # before it counts as a failed publication.
      - name: Verify production serves this build
        env:
          BASE: ${{ steps.deployment.outputs.page_url }}
          ENTRY: ${{ needs.web-build.outputs.entry }}
        run: node scripts/check-published.mjs web "$BASE" --entry "$ENTRY" --wait 600

  deploy-mobile:
    needs: [classify, gate]
    if: >-
      ${{ !cancelled()
      && needs.gate.result == 'success'
      && needs.classify.outputs.deploy_mobile == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: helix
    steps:
      # The same guard as `deploy-web`, for the same reason.
      - name: Refuse to publish a commit main has moved past
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::main is at $head and this run is $GITHUB_SHA; nothing was published, and the run for $head publishes"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Publish directly from this checked-out commit, after the gate. Expo Go
      # uses the SDK runtime, so there is no binary lookup, build or Apple
      # credential path.
      #
      # The CLI is not in the lockfile — `tests/repo/release-config.test.ts` records
      # why — so npx resolves its whole tree, 525 packages, at publish time. Two
      # things keep that tree from choosing what runs beside EXPO_TOKEN:
      # - It is installed HERE, in a step without the token, and the publish
      #   step runs `npx --yes=false`, which refuses to install anything. Not
      #   `--no`: npm does not know that flag, takes the package name as its
      #   value and hands the command's own flags to npm — measured, `--version`
      #   printed npm's version, not the CLI's. With `--ignore-scripts` neither
      #   of the tree's install hooks runs — dtrace-provider compiles a native
      #   addon, protobufjs runs a postinstall — and 23.2.0 starts without
      #   either, measured.
      # - `npm_config_before` resolves every transitive range as it stood on a
      #   fixed day, so nothing published after that day can enter, however it
      #   was published. `.npmrc`'s `min-release-age` would do this on a rolling
      #   window and does nothing on the npm Node 22 ships. Move the date with
      #   `eas.json`'s CLI version: a date before a release refuses it outright,
      #   which is the loud failure to want.
      - name: Install the pinned EAS CLI without the credential
        env:
          npm_config_before: "2026-09-08"
        run: npx --yes --ignore-scripts eas-cli@23.2.0 --version
      - name: Publish Expo Go preview update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::EXPO_TOKEN is not configured; the preview OTA was not published."
            exit 1
          fi
          version=$(node -p "require('./app.json').expo.version")
          # `--environment` is mandatory from SDK 55 on: without it the CLI
          # refuses the publish rather than defaulting, so it is pinned to the
          # branch this job actually updates. `--json` prints only the updates
          # to stdout; the CLI's own log goes to stderr.
          npx --yes=false eas-cli@23.2.0 update --branch preview --environment preview --platform all --message "$version $GITHUB_SHA" --clear-cache --non-interactive --json > "$RUNNER_TEMP/eas-update.json"
      # One update per platform, one group, on the runtime Expo Go runs — and
      # the group and update ids written onto the run's summary, which is the
      # record a rollback republishes from.
      - name: Verify and record the published update
        run: node scripts/check-published.mjs ota "$RUNNER_TEMP/eas-update.json"
