# Row-level security, asserted.
#
# `supabase/tests/owner_integrity_and_rls.sql` is 138 pgTAP assertions and it is
# the ONLY executable proof that one account cannot read or write another's
# rows. Client-side ownership checks are defence in depth; RLS is the authority.
# Until now nothing ran the file, so the authority was unverified between one
# manual run and the next.
#
# It runs against a LOCAL stack, not the linked project. The suite inserts into
# `auth.users` and rolls back, which is safe by construction — but "safe by
# construction against production" is a promise the schedule would be making
# every week, unattended, and a local stack does not have to make it. It also
# needs no `SUPABASE_ACCESS_TOKEN`, so a scheduled job holds no credential.
#
# Triggers: the migrations or policies changed, once a week regardless (a
# Postgres image update can change behaviour with no commit of ours), or by
# hand. It deploys nothing; a red run is a bug report.
name: database

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/database.yml"
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The CLI comes from npm rather than from `supabase/setup-cli`. This
      # repository allows GitHub-owned actions only — `patterns_allowed` is
      # empty and `verified_allowed` is false — so a third-party action is
      # refused before the run starts, with no log to say why. Loosening that
      # allowlist to import one step is the wrong trade; `npx` at a pinned
      # version is the same software with none of it.
      #
      # Pinned, not `latest`: a CLI that changes under a scheduled job turns a
      # green history red for a reason that is not ours.
      - run: npx --yes supabase@2.109.1 --version
      # The migrations under `supabase/migrations` are applied as the stack
      # boots, so the tests run against the schema this commit actually ships.
      - run: npx --yes supabase@2.109.1 start
      # The same linter the invariants require to stay clean after a migration
      # change. Cheap here, and it runs before the assertions so a schema fault
      # is reported as a schema fault rather than as 138 failed tests.
      # The managed `extensions` schema contains pgTAP internals that the
      # linter cannot resolve as ordinary application functions. The product
      # schema is the surface this workflow owns and is the one we gate.
      - run: npx --yes supabase@2.109.1 db lint --local --schema public --fail-on warning
      - run: npx --yes supabase@2.109.1 test db --local
      - if: always()
        run: npx --yes supabase@2.109.1 stop --no-backup
