# CodeQL and scheduled dependency auditing.
#
# CodeQL remains advisory because new query packs can change without a source
# change. High/critical dependency advisories also run here on a schedule, but
# the same deterministic lockfile check runs in ci/quality and blocks delivery.
#
# This replaced a separate PR-only dependency-review workflow. There are no
# pull requests any more (work lands directly on main), so the lockfile is
# audited here instead, where it is still reachable.
name: security

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "scripts/**"
      - "supabase/**"
      - ".github/workflows/**"
  schedule:
    # Weekly, so a newly published query pack still reaches a quiet repository.
    - cron: "0 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: analyze javascript-typescript
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: javascript-typescript
          # `security-and-quality` also reports maintainability queries, which
          # would bury real findings in a single-developer repository.
          queries: security-extended
      # No build step: CodeQL extracts JS/TS directly from source. Running the
      # Expo web export here would only duplicate the `web-build` job's work.
      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: "/language:javascript-typescript"

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # No `npm ci`: the audit resolves from package-lock.json alone.
      # High and critical only, and every accepted advisory is named with its
      # evidence in the script. A bare `npm audit --audit-level=high` went
      # permanently red on one advisory with no compatible fix, and the two
      # usual escapes — lowering the level, or `--omit=dev` — would each have
      # hidden real findings instead of explaining this one. (`xlsx` comes from
      # the SheetJS CDN tarball and is invisible to the registry audit either
      # way, which is why a moderate gate here would mostly report noise.)
      - run: node scripts/check-advisories.mjs

  # Who built what is in the lockfile, as opposed to whether it is known-broken.
  #
  # `npm audit signatures` checks two different things: that every tarball
  # matches the registry's own Sigstore signature, and — for the packages that
  # publish it — the SLSA provenance attestation binding the tarball to the
  # commit and workflow that produced it. A tampered or re-uploaded tarball
  # fails the first; a package published from somewhere other than its own
  # repository fails the second. Neither is something `npm audit` can see, and
  # neither was checked anywhere before.
  #
  # It needs the tree on disk, which the advisory job deliberately does without,
  # so it is its own job. `--ignore-scripts` is not caution theatre here: the
  # whole point of this job is to inspect these packages, and running their
  # install hooks first would mean executing the code under review.
  signatures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Measured 2026-08-07: 1339 packages with verified registry signatures,
      # 240 of them also carrying an attestation. A count that falls is a
      # package that stopped being verifiable.
      - run: npm audit signatures
