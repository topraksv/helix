version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      safe-npm-updates:
        update-types: [minor, patch]
    # Expo SDK owns the compatible React/React Native/native-library matrix.
    # Dependabot treats React Native's pre-1.0 minor jumps as ordinary minors,
    # and can also propose unsupported patch lines. Ignore routine version
    # updates at every SemVer level; Dependabot security updates remain
    # eligible. Remove these guards only in the same change as a coordinated,
    # compatibility-tested SDK/toolchain upgrade.
    ignore:
      - dependency-name: "expo*"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "babel-preset-expo"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-native-web"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-native-safe-area-context"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-native-screens"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-native-svg"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      # Reanimated pins its own worklets runtime and both are resolved by the
      # SDK, so a routine bump of either desynchronises the pair. PR #113
      # proposed reanimated 4.1.1 -> 4.5.3, worklets 0.5.1 -> 0.11.3 and
      # keyboard-controller 1.18.5 -> 1.22.3 while `expo install --check`
      # reported the installed versions as the SDK 54 matrix.
      - dependency-name: "react-native-reanimated"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-native-worklets"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-native-keyboard-controller"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "eslint-config-expo"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      # ESLint 10 and TypeScript 7 are both blocked by the lint plugins Expo's
      # config bundles, and both were measured on 2026-09-09 rather than
      # assumed. ESLint 10 removed `context.getFilename()`; the NEWEST
      # `eslint-plugin-react` (7.37.5) still calls it and its own peer range
      # stops at `^9.7`, so `expo lint` dies on the first file. TypeScript 7
      # typechecks this tree clean, but the newest
      # `@typescript-eslint/typescript-estree` (8.70.0) declares
      # `typescript: ">=4.8.4 <6.1.0"` and throws before linting a line.
      # Neither has an upstream release that would work; re-check when
      # `eslint-plugin-react` publishes an ESLint 10 peer.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Vitest 5 breaks the MUTATION gate, which is the one failure a green
      # test run hides. Measured 2026-09-09 on `src/domain/category-icons.ts`:
      # 97.37 under vitest 4, 71.05 under vitest 5, with only 20 of 76 mutants
      # getting per-test coverage attribution. It is the runner and not the
      # code — a mutant Stryker reported as SURVIVED was applied by hand and
      # failed two real tests. Both `@stryker-mutator/vitest-runner` 9.6.1 and
      # 10.0.0 behave the same way and both declare `vitest: ">=2.0.0"`, so npm
      # gives no warning. Adopting it would have re-baselined 67 files against
      # a broken instrument. Re-check when the runner names vitest 5 explicitly.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@stryker-mutator/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Istanbul
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
