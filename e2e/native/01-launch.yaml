# Native cold start: JavaScript ran, `migrateDb` completed on the native SQLite driver, the splash
# dismissed and the subset fonts loaded from the bundle. All silent in the browser suite.
appId: com.toprak.helix
---
- launchApp:
    clearState: true
# A dev-client build downloads its JavaScript from Metro on every launch, so the
# first assertion waits for the bundle; an embedded release bundle is far faster.
- extendedWaitUntil:
    visible: "Helix"
    timeout: 90000
# The greeting is one heading beside the mark, the same text in all three auth modes.
- assertVisible: "Helix'e hoş geldin"
# The font assertion: ı, ş, ğ and ö live in the ranges `scripts/subset-fonts.mjs` keeps, and a broken
# subset draws tofu rather than failing loudly.
- assertVisible: ".*paranın nereye gittiğini gör.*"
