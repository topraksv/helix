# The app opens on a real device.
#
# The most valuable native assertion available, and the only one that covers
# these four at once: JavaScript ran, `migrateDb` completed against the NATIVE
# SQLite driver, the splash dismissed, and the vendored subset fonts loaded
# from the app bundle. Every one of them is silent in the browser suite, and
# the font one is new — `assets/fonts/*.ttf` are subsets now, and a face that
# fails to load on iOS renders nothing at all.
appId: com.toprak.helix
---
- launchApp:
    clearState: true
# A dev-client build downloads its JavaScript from Metro on every launch, so
# the first assertion has to wait for the bundle rather than race it. A release
# build with an embedded bundle is up in a fraction of this.
- extendedWaitUntil:
    visible: "Helix"
    timeout: 90000
# Turkish glyphs specifically: ş, ı, ğ and ü live in the ranges the subset
# keeps, and a broken subset draws tofu here rather than failing loudly.
- assertVisible: "Kişisel finans çalışma alanın"
# A regex, because this heading is not its own accessibility node: the card
# merges its title, its description and the signature line into ONE label, so
# an exact match finds nothing. That merge is also why the label reads
# "…seni bekliyor.. E-posta…" with two full stops.
- assertVisible: ".*Çalışma alanına dön.*"
