# Password recovery and the way back. Recovery is a state of the sign-in screen, not a Stack push,
# so the way back is the screen's own link: an edge-swipe assertion would pass on Android and mean
# nothing on iOS.
appId: com.toprak.helix
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Hesabına giriş yap"
    timeout: 90000
- scrollUntilVisible:
    element:
      text: "Şifremi unuttum"
    direction: DOWN
    timeout: 10000
- tapOn: "Şifremi unuttum"
- assertVisible: "Şifreni yenile"
- scrollUntilVisible:
    element:
      text: "Kod Gönder"
    direction: DOWN
    timeout: 10000
- assertVisible: "Kod Gönder"
# Never reveal whether an address has an account.
- assertNotVisible: "Hesabına giriş yap"
# The reset screen's own way back, not the sign-up screen's "Zaten hesabım var".
- scrollUntilVisible:
    element:
      text: "Giriş ekranına dön"
    direction: DOWN
    timeout: 10000
- tapOn: "Giriş ekranına dön"
- extendedWaitUntil:
    visible: "Hesabına giriş yap"
    timeout: 20000
- assertVisible: "Şifremi unuttum"
