# The native sign-in surface renders its controls. The web E2E build empties the Supabase
# configuration, so the cloud entry has only ever been exercised here.
appId: com.toprak.helix
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Hesabına giriş yap"
    timeout: 90000
- assertVisible: "E-posta"
- assertVisible: "Şifre"
# At Dynamic Type sizes the form is taller than the phone: scroll to a control before asserting it.
- scrollUntilVisible:
    element:
      text: "Giriş yap"
    direction: DOWN
    timeout: 10000
- assertVisible: "Giriş yap"
- assertVisible: "Şifremi unuttum"
- assertVisible: "Verilerin cihazında saklanır, internet yokken de çalışır."
# Both directions of the mode switch are exercised so the link cannot drift from the form.
- scrollUntilVisible:
    element:
      text: "Yeni hesap oluştur"
    direction: DOWN
    timeout: 10000
- tapOn: "Yeni hesap oluştur"
- assertVisible: "Hesap oluştur"
# Consent is a condition of creating the account, and the notice must open from the form (the root
# guard once bounced signed-out readers away from it).
- assertVisible: "Aydınlatma Metni'ni oku ve onayla"
- tapOn: "Aydınlatma Metni'ni oku ve onayla"
- extendedWaitUntil:
    visible: "Aydınlatma Metni"
    timeout: 20000
# It opens over the form: a push would cost whatever had been typed.
- tapOn: "Kapat"
- assertVisible: "Hesap oluştur"
# Closing without reading leaves consent ungiven.
- assertVisible: "Aydınlatma Metni'ni oku ve onayla"
# The notice must scroll: it once nested its ScrollView in a Pressable, which swallowed the drag.
- tapOn: "Aydınlatma Metni'ni oku ve onayla"
- extendedWaitUntil:
    visible: "Aydınlatma Metni"
    timeout: 20000
# Sized from the notice's real length: consent sits at the END on purpose, so every addition to the
# disclosure costs scrolling (a 30s budget expired with the control already rendered).
- scrollUntilVisible:
    element:
      text: ".*Okudum, anladım.*"
    direction: DOWN
    timeout: 60000
- tapOn: ".*Okudum, anladım.*"
- extendedWaitUntil:
    visible: "Aydınlatma Metni onaylandı"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Zaten hesabım var, giriş yap"
    direction: DOWN
    timeout: 10000
- assertVisible: "Zaten hesabım var, giriş yap"
- tapOn: "Zaten hesabım var, giriş yap"
- assertVisible: "Hesabına giriş yap"
