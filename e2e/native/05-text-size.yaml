# The app survives the user's own text size. React Native scales every `Text` for free; the risk is
# geometry measured in points (the 116pt label column, fitted cell widths, the 56pt tab bar). The
# browser cannot ask this (`fontScale` is a constant 1 there), so run it at the size it is about:
#   xcrun simctl ui booted content_size accessibility-large   # ~200%, the WCAG bar
#   npm run test:native
#   xcrun simctl ui booted content_size large
# Deliberately NOT asserted: the welcome screen's three-step strip, one merged accessibility node whose
# words are not queryable; `tests/accessibility-contract.test.ts` holds its `maxFontSizeMultiplier`.
appId: com.toprak.helix
---
- launchApp:
    clearState: true
# iOS's "save this password?" sheet belongs to the keychain, outlives `clearState`, and covers the screen.
- runFlow:
    when:
      visible: "Parola Kaydedilsin mi?"
    commands:
      - tapOn: "Sonra"
- extendedWaitUntil:
    visible: "Helix"
    timeout: 90000
# Which surface renders depends on whether this simulator has an account, so both greetings are accepted:
# the assertion is the TEXT surviving. It waits because a dev-client paints the "Helix" mark before the
# routed screen, and the gap grows when the machine is busy (`.claude/rules/e2e.md`).
- extendedWaitUntil:
    visible: "Helix'e hoş geldin|Günaydın|İyi günler|İyi akşamlar|İyi geceler"
    timeout: 30000
# The tab bar (five columns in a 56pt bar) drops to icons once a label no longer clears its column, so
# assert the accessibility label, present whether or not the text is drawn. Needs an existing workspace;
# a fresh device lands on the entry surface, which has no navigation.
- runFlow:
    when:
      notVisible: "Helix'e hoş geldin"
    commands:
      - assertVisible:
          id: ".*"
          text: "Ayarlar"
